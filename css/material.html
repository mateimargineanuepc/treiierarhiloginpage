<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    brand: {
                        DEFAULT: '#4F46E5',
                        dark: '#4338CA',
                        light: '#EEF2FF',
                    },
                    accent: {
                        DEFAULT: '#06B6D4',
                        dark: '#0891B2',
                    },
                    surface: '#F9FAFB',
                    slate: {
                        heading: '#1E293B',
                        body: '#64748B',
                    },
                },
                fontFamily: {
                    sans: ['Inter', 'system-ui', 'sans-serif'],
                },
                boxShadow: {
                    card: '0 1px 3px rgba(0,0,0,0.03), 0 4px 12px rgba(0,0,0,0.04)',
                    card-md: '0 4px 16px rgba(0,0,0,0.06)',
                },
            },
        },
    };
</script>
<style>
    :root {
        --color-primary: #4F46E5;
        --color-primary-dark: #4338CA;
        --color-primary-light: #EEF2FF;
        --color-secondary: #06B6D4;
        --color-error: #DC2626;
        --color-error-dark: #B91C1C;
        --color-intrare: #10B981;
        --color-intrare-light: #ECFDF5;
        --color-iesire: #DC2626;
        --color-iesire-light: #FEF2F2;
        --color-surface: #F9FAFB;
        --color-card: #FFFFFF;
        --color-text: #1E293B;
        --color-text-secondary: #64748B;
        --color-border: rgba(226, 232, 240, 0.8);
        --sidebar-width: 260px;
        --header-height: 72px;
        --radius: 12px;
        --radius-lg: 16px;
        --shadow-card: 0 1px 3px rgba(0,0,0,0.03), 0 4px 12px rgba(0,0,0,0.04);
        --transition: 0.2s ease;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--color-surface);
        color: var(--color-text);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
    }

    /* ── Skeleton loaders ── */
    @keyframes skeleton-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
    }

    .skeleton {
        background: linear-gradient(90deg, #E2E8F0 0%, #F1F5F9 50%, #E2E8F0 100%);
        background-size: 200% 100%;
        animation: skeleton-pulse 1.5s ease-in-out infinite;
        border-radius: 8px;
    }

    .skeleton--text { height: 14px; margin-bottom: 8px; }
    .skeleton--text-lg { height: 28px; width: 60%; }
    .skeleton--card { height: 88px; border-radius: var(--radius-lg); }
    .skeleton--row { height: 40px; margin-bottom: 8px; }
    .skeleton--chart { height: 280px; border-radius: var(--radius-lg); }

    .skeleton-grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    .skeleton-stack { display: flex; flex-direction: column; gap: 12px; }

    /* ── App shell ── */
    #app-root {
        display: flex;
        min-height: 100vh;
    }

    .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 100vh;
    }

    @media (min-width: 1024px) {
        .main-wrapper {
            margin-left: var(--sidebar-width);
        }
    }

    /* ── Sidebar ── */
    .drawer-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.4);
        z-index: 200;
        backdrop-filter: blur(2px);
    }

    .drawer-overlay--open { display: block; }

    .drawer {
        position: fixed;
        top: 0;
        left: calc(-1 * var(--sidebar-width));
        width: var(--sidebar-width);
        height: 100%;
        background: var(--color-card);
        z-index: 201;
        transition: left 0.25s ease;
        box-shadow: 4px 0 24px rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--color-border);
    }

    .drawer--open { left: 0; }

    @media (min-width: 1024px) {
        .drawer {
            left: 0;
        }
        .drawer-overlay { display: none !important; }
    }

    .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 24px 20px 20px;
        border-bottom: 1px solid var(--color-border);
    }

    .sidebar-brand__icon {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, var(--color-primary) 0%, #6366F1 100%);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        flex-shrink: 0;
    }

    .sidebar-brand__text {
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--color-text);
        letter-spacing: -0.02em;
    }

    .sidebar-brand__sub {
        font-size: 0.7rem;
        color: var(--color-text-secondary);
        font-weight: 500;
        margin-top: 2px;
    }

    .sidebar-nav {
        flex: 1;
        padding: 16px 12px;
        overflow-y: auto;
    }

    .sidebar-nav__label {
        font-size: 0.65rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--color-text-secondary);
        padding: 8px 12px 6px;
    }

    .drawer__item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        cursor: pointer;
        border: none;
        background: none;
        width: 100%;
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 500;
        text-align: left;
        min-height: 44px;
        border-radius: 10px;
        color: var(--color-text-secondary);
        transition: background var(--transition), color var(--transition);
        position: relative;
    }

    .drawer__item svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        opacity: 0.75;
    }

    .drawer__item:hover {
        background: #F1F5F9;
        color: var(--color-text);
    }

    .drawer__item:hover svg { opacity: 1; }

    .drawer__item--active {
        background: var(--color-primary-light);
        color: var(--color-primary);
        font-weight: 600;
    }

    .drawer__item--active svg {
        opacity: 1;
        color: var(--color-primary);
    }

    .drawer__item--active::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 24px;
        background: var(--color-primary);
        border-radius: 0 3px 3px 0;
    }

    .drawer__divider {
        height: 1px;
        background: var(--color-border);
        margin: 8px 12px;
    }

    .sidebar-profile {
        padding: 16px;
        border-top: 1px solid var(--color-border);
        margin-top: auto;
    }

    .sidebar-profile__card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        background: #F8FAFC;
        border-radius: var(--radius);
        border: 1px solid var(--color-border);
    }

    .sidebar-profile__avatar {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--color-secondary) 0%, #0891B2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 0.85rem;
        flex-shrink: 0;
    }

    .sidebar-profile__name {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .sidebar-profile__role {
        font-size: 0.7rem;
        color: var(--color-text-secondary);
    }

    /* ── Top header ── */
    .top-bar {
        background: var(--color-card);
        color: var(--color-text);
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        position: sticky;
        top: 0;
        z-index: 100;
        min-height: var(--header-height);
        border-bottom: 1px solid var(--color-border);
        box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }

    .top-bar__menu {
        background: none;
        border: none;
        color: var(--color-text-secondary);
        cursor: pointer;
        padding: 8px;
        border-radius: 10px;
        min-width: 40px;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background var(--transition), color var(--transition);
    }

    .top-bar__menu:hover {
        background: #F1F5F9;
        color: var(--color-text);
    }

    @media (min-width: 1024px) {
        .top-bar__menu { display: none; }
    }

    .top-bar__title {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--color-text);
        letter-spacing: -0.02em;
        white-space: nowrap;
    }

    .top-bar__search {
        flex: 1;
        max-width: 400px;
        margin-left: 8px;
        position: relative;
        display: none;
    }

    @media (min-width: 768px) {
        .top-bar__search { display: block; }
    }

    .top-bar__search input {
        width: 100%;
        padding: 10px 16px 10px 40px;
        border: 1px solid var(--color-border);
        border-radius: 12px;
        font-family: inherit;
        font-size: 0.875rem;
        background: #F8FAFC;
        color: var(--color-text);
        transition: border-color var(--transition), box-shadow var(--transition);
    }

    .top-bar__search input:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        background: white;
    }

    .top-bar__search input::placeholder { color: #94A3B8; }

    .top-bar__search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #94A3B8;
        pointer-events: none;
    }

    .top-bar__actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
    }

    .top-bar__icon-btn {
        position: relative;
        background: none;
        border: none;
        cursor: pointer;
        padding: 10px;
        border-radius: 10px;
        color: var(--color-text-secondary);
        transition: background var(--transition), color var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .top-bar__icon-btn:hover {
        background: #F1F5F9;
        color: var(--color-text);
    }

    .top-bar__notif-dot {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 8px;
        height: 8px;
        background: #EF4444;
        border-radius: 50%;
        border: 2px solid white;
    }

    .top-bar__user {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--color-text-secondary);
        padding: 8px 14px;
        background: #F8FAFC;
        border-radius: 10px;
        border: 1px solid var(--color-border);
        display: none;
    }

    @media (min-width: 640px) {
        .top-bar__user { display: block; }
    }

    /* ── Main content ── */
    .app-container {
        flex: 1;
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
        padding: 24px;
        padding-bottom: 48px;
    }

    .app-container--entry {
        max-width: 560px;
    }

    /* ── Balance stat cards ── */
    .balance-cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 24px;
    }

    @media (max-width: 400px) {
        .balance-cards { grid-template-columns: 1fr; }
    }

    .balance-card {
        background: var(--color-card);
        border-radius: var(--radius-lg);
        padding: 20px;
        box-shadow: var(--shadow-card);
        border: 1px solid var(--color-border);
        transition: box-shadow var(--transition), transform var(--transition);
    }

    .balance-card:hover {
        box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .balance-card__label {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--color-text-secondary);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    .balance-card__amount {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--color-intrare);
        letter-spacing: -0.02em;
    }

    .balance-card--bank .balance-card__amount {
        color: var(--color-primary);
    }

    .balance-card--loading .balance-card__amount {
        min-height: 32px;
    }

    /* ── Cards ── */
    .card {
        background: var(--color-card);
        border-radius: var(--radius-lg);
        padding: 20px;
        margin-bottom: 16px;
        box-shadow: var(--shadow-card);
        border: 1px solid var(--color-border);
        transition: opacity var(--transition);
    }

    @media (min-width: 600px) {
        .card { padding: 24px; }
    }

    .card__title {
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--color-text-secondary);
        margin: 0 0 14px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }

    .card--disabled {
        opacity: 0.5;
        pointer-events: none;
    }

    /* ── Buttons ── */
    .btn-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .btn-choice {
        min-height: 48px;
        border: 1.5px solid #E2E8F0;
        border-radius: var(--radius);
        background: white;
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition);
        padding: 12px;
        color: var(--color-text);
    }

    .btn-choice:hover {
        border-color: #CBD5E1;
        background: #F8FAFC;
    }

    .btn-choice:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .btn-choice--selected-intrare {
        background: var(--color-intrare);
        border-color: var(--color-intrare);
        color: white;
    }

    .btn-choice--selected-intrare:hover {
        background: #059669;
        border-color: #059669;
    }

    .btn-choice--selected-iesire {
        background: var(--color-iesire);
        border-color: var(--color-iesire);
        color: white;
    }

    .btn-choice--selected-iesire:hover {
        background: var(--color-error-dark);
        border-color: var(--color-error-dark);
    }

    .btn-choice--selected-neutral {
        background: var(--color-primary-light);
        border-color: var(--color-primary);
        color: var(--color-primary);
    }

    .btn-choice--selected-neutral:hover {
        background: #E0E7FF;
    }

    /* ── Form fields ── */
    .form-field {
        width: 100%;
        margin-bottom: 8px;
    }

    .form-field label {
        display: block;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--color-text-secondary);
        margin-bottom: 6px;
    }

    .field-hint {
        display: block;
        font-size: 0.72rem;
        color: var(--color-text-secondary);
        margin-top: 6px;
        line-height: 1.4;
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
        width: 100%;
        min-height: 48px;
        padding: 12px 14px;
        border: 1px solid #E2E8F0;
        border-radius: 10px;
        font-family: inherit;
        font-size: 0.95rem;
        background: white;
        color: var(--color-text);
        transition: border-color var(--transition), box-shadow var(--transition);
    }

    .form-field input[type="checkbox"] {
        width: 16px;
        min-height: 16px;
        height: 16px;
        padding: 0;
        border-radius: 4px;
        flex-shrink: 0;
        accent-color: var(--color-primary);
    }

    .period-name-input { min-height: 44px; }

    .form-field textarea {
        min-height: 88px;
        resize: vertical;
    }

    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .btn-save {
        width: 100%;
        min-height: 52px;
        background: var(--color-primary);
        color: white;
        border: none;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 4px;
        letter-spacing: 0.02em;
        transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
    }

    .btn-save:disabled {
        background: #CBD5E1;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }

    .btn-save:not(:disabled):hover {
        background: var(--color-primary-dark);
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .btn-save:not(:disabled):active {
        transform: scale(0.99);
    }

    .btn-save:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.3);
    }

    /* ── Snackbar ── */
    .snackbar {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: #1E293B;
        color: white;
        padding: 14px 24px;
        border-radius: 12px;
        z-index: 300;
        transition: transform 0.3s ease;
        max-width: 90%;
        text-align: center;
        font-size: 0.9rem;
        font-weight: 500;
        box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .snackbar--visible {
        transform: translateX(-50%) translateY(0);
    }

    .snackbar--error { background: var(--color-error); }

    /* ── Reports ── */
    .report-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        position: sticky;
        top: var(--header-height);
        z-index: 99;
        background: var(--color-surface);
        padding: 4px 0 16px;
        margin: 0 0 8px;
        -webkit-overflow-scrolling: touch;
    }

    .report-tab {
        flex: 0 0 auto;
        min-height: 40px;
        padding: 8px 16px;
        border: 1px solid #E2E8F0;
        border-radius: 10px;
        background: white;
        font-family: inherit;
        font-size: 0.82rem;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        color: var(--color-text-secondary);
        transition: all var(--transition);
    }

    .report-tab:hover {
        border-color: #CBD5E1;
        color: var(--color-text);
        background: #F8FAFC;
    }

    .report-tab--active {
        background: var(--color-primary);
        color: white;
        border-color: var(--color-primary);
        font-weight: 600;
    }

    .report-tab--active:hover {
        background: var(--color-primary-dark);
        border-color: var(--color-primary-dark);
        color: white;
    }

    .report-filters { margin-bottom: 16px; }

    .date-range-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 12px;
    }

    .filter-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
    }

    .filter-actions .btn-save {
        width: auto;
        min-width: 140px;
        padding: 0 24px;
        margin-top: 0;
    }

    .report-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
    }

    .report-table th,
    .report-table td {
        padding: 12px 10px;
        text-align: left;
        border-bottom: 1px solid #F1F5F9;
    }

    .report-table th {
        font-weight: 600;
        color: var(--color-text-secondary);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    .report-table tbody tr:hover {
        background: #F8FAFC;
    }

    .report-table .total-row {
        font-weight: 700;
        background: #F8FAFC;
    }

    .report-category-group { margin-bottom: 20px; }
    .report-category-group:last-child { margin-bottom: 0; }

    .report-category-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 8px 0 10px;
        border-bottom: 2px solid var(--color-primary-light);
        margin-bottom: 4px;
    }

    .report-category-total {
        font-weight: 700;
        color: var(--color-primary);
        white-space: nowrap;
    }

    .report-summary {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
    }

    .report-summary__item {
        background: #F8FAFC;
        padding: 16px;
        border-radius: var(--radius);
        text-align: center;
        border: 1px solid var(--color-border);
    }

    .report-summary__label {
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--color-text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    .report-summary__value {
        font-size: 1.25rem;
        font-weight: 700;
        margin-top: 4px;
    }

    .fisa-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    @media (max-width: 600px) {
        .fisa-columns { grid-template-columns: 1fr; }
    }

    .fisa-column__title {
        margin: 0 0 10px;
        font-size: 1rem;
        font-weight: 700;
    }

    .text-intrare { color: var(--color-intrare); }
    .text-iesire { color: var(--color-iesire); }

    .fisa-amount {
        text-align: right;
        white-space: nowrap;
        font-weight: 500;
    }

    .excedent-row {
        margin-top: 20px;
        padding: 16px;
        border-radius: var(--radius);
        text-align: center;
        font-weight: 700;
        font-size: 1.05rem;
    }

    .excedent--positive {
        background: var(--color-intrare-light);
        color: var(--color-intrare);
        border: 1px solid #A7F3D0;
    }
