<div id="reports-view" class="hidden">
    <div class="report-tabs" id="report-tabs">
        <button type="button" class="report-tab report-tab--active" data-tab="fisa">Situația lunii</button>
        <button type="button" class="report-tab" data-tab="comparativ">Compară</button>
        <button type="button" class="report-tab" data-tab="istoric">Istoric</button>
        <button type="button" class="report-tab" data-tab="detaliat">Raport detaliat</button>
    </div>

    <div id="filters-fisa" class="report-filters card">
        <p class="card__title">Perioadă</p>
        <div class="date-range-row">
            <div class="form-field">
                <label for="fisa-from">De la</label>
                <input type="date" id="fisa-from">
                <span class="field-hint field-hint--date"></span>
            </div>
            <div class="form-field">
                <label for="fisa-to">Până la</label>
                <input type="date" id="fisa-to">
                <span class="field-hint field-hint--date"></span>
            </div>
        </div>
        <div class="filter-actions">
            <button type="button" class="btn-text" id="fisa-preset-month">Luna curentă</button>
            <button type="button" class="btn-save" id="fisa-generate">Generează</button>
        </div>
    </div>

    <div id="filters-comparativ" class="report-filters card hidden">
        <div class="form-field">
            <label for="comp-a-name">Denumire perioadă A</label>
            <input type="text" id="comp-a-name" class="period-name-input" value="Perioada A" maxlength="60" autocomplete="off">
        </div>
        <div class="date-range-row">
            <div class="form-field">
                <label for="comp-a-from">De la</label>
                <input type="date" id="comp-a-from">
                <span class="field-hint field-hint--date"></span>
            </div>
            <div class="form-field">
                <label for="comp-a-to">Până la</label>
                <input type="date" id="comp-a-to">
                <span class="field-hint field-hint--date"></span>
            </div>
        </div>
        <div class="form-field compare-period-b-toggle">
            <label class="category-checkbox">
                <input type="checkbox" id="comp-b-enabled">
                <span>Compară și cu Perioada B</span>
            </label>
        </div>
        <div id="comp-b-section" class="hidden">
            <div class="form-field">
                <label for="comp-b-name">Denumire perioadă B</label>
                <input type="text" id="comp-b-name" class="period-name-input" value="Perioada B" maxlength="60" autocomplete="off">
            </div>
            <div class="date-range-row">
                <div class="form-field">
                    <label for="comp-b-from">De la</label>
                    <input type="date" id="comp-b-from">
                    <span class="field-hint field-hint--date"></span>
                </div>
                <div class="form-field">
                    <label for="comp-b-to">Până la</label>
                    <input type="date" id="comp-b-to">
                    <span class="field-hint field-hint--date"></span>
                </div>
            </div>
        </div>
        <p class="card__title" style="margin-top:12px">Categorii de comparat</p>
        <div class="compare-category-panels">
            <div class="compare-category-panel">
                <p class="compare-category-panel__title compare-category-panel__title--intrare">Intrări</p>
                <div class="compare-category-actions">
                    <button type="button" class="btn-text" data-comp-select="comp-categories-intrari" data-select="all">Selectează tot</button>
                    <button type="button" class="btn-text" data-comp-select="comp-categories-intrari" data-select="none">Deselectează tot</button>
                </div>
                <div id="comp-categories-intrari" class="category-checkboxes"></div>
            </div>
            <div class="compare-category-panel">
                <p class="compare-category-panel__title compare-category-panel__title--iesire">Ieșiri</p>
                <div class="compare-category-actions">
                    <button type="button" class="btn-text" data-comp-select="comp-categories-iesiri" data-select="all">Selectează tot</button>
                    <button type="button" class="btn-text" data-comp-select="comp-categories-iesiri" data-select="none">Deselectează tot</button>
                </div>
                <div id="comp-categories-iesiri" class="category-checkboxes"></div>
            </div>
        </div>
        <div class="filter-actions">
            <button type="button" class="btn-save" id="comp-generate">Compară</button>
        </div>
    </div>

    <div id="filters-istoric" class="report-filters card hidden">
        <div class="form-field">
            <label for="ist-tip">Tip</label>
            <select id="ist-tip">
                <option value="intrare">Intrări</option>
                <option value="iesire">Ieșiri</option>
            </select>
        </div>
        <div class="form-field">
            <label for="ist-categories-ms">Categorii</label>
            <div id="ist-categories-ms" class="ms-select"></div>
        </div>
        <div class="date-range-row">
            <div class="form-field">
                <label for="ist-from">De la</label>
                <input type="date" id="ist-from">
                <span class="field-hint field-hint--date"></span>
            </div>
            <div class="form-field">
                <label for="ist-to">Până la</label>
                <input type="date" id="ist-to">
                <span class="field-hint field-hint--date"></span>
            </div>
        </div>
        <div class="filter-actions">
            <button type="button" class="btn-text" id="ist-preset-month">Luna curentă</button>
            <button type="button" class="btn-save" id="ist-generate">Generează</button>
        </div>
    </div>

    <div id="filters-detaliat" class="report-filters card hidden">
        <p class="card__title">Perioadă</p>
        <div class="date-range-row">
            <div class="form-field">
                <label for="det-from">De la</label>
                <input type="date" id="det-from">
                <span class="field-hint field-hint--date"></span>
            </div>
            <div class="form-field">
                <label for="det-to">Până la</label>
                <input type="date" id="det-to">
                <span class="field-hint field-hint--date"></span>
            </div>
        </div>
        <div class="filter-actions">
            <button type="button" class="btn-text" id="det-preset-month">Luna curentă</button>
            <button type="button" class="btn-save" id="det-generate">Generează</button>
        </div>
    </div>

    <div id="reports-tab-content">
        <div class="loading">Selectați un raport și apăsați Generează.</div>
    </div>
</div>
